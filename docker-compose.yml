services:
  # MongoDB local con Replica Set para soportar transacciones.
  database:
    image: mongo:6.0
    container_name: sabor-gestion-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_local_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

  mongo-init:
    image: mongo:6.0
    container_name: sabor-gestion-db-init
    depends_on:
      - database
    entrypoint: ["bash", "-c", "sleep 3 && mongosh --host database:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]})' || true"]

volumes:
  mongo_local_data:
